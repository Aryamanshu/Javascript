<!-- how to create a new element in DOM  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom | chai or code</title>
</head>
<body style="background-color: #212121; color: #fff">

    
</body>

<script>
   
     const div = document.createElement('div'); // jo man kre wo create kr skte h
     console.log(div);
     div.className="main"
     div.id = Math.round(Math.random() * 10 + 1)
     div.setAttribute("title", "generatedd title")
     div.style.backgroundColor = "green"
     div.style.padding = "12px"
     // div.innerText = "chai or code by aryamanshu"
     const addText = document.createTextNode ("chaiii orr codee")
     div.appendChild(addText)

     document.body.appendChild(div)
     
</script>
</html>
